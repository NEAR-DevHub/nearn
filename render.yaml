services:
  - type: web
    name: nearn-app
    runtime: node
    region: frankfurt
    plan: standard
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    preDeployCommand: pnpm prisma migrate deploy
    repo: https://github.com/NEAR-DevHub/nearn
    branch: prod
    domains:
      - nearn.io
    startCommand: pnpm start
    envVars:
      - key: CRON_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NODE_VERSION
        value: 20.11.0
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: EMAIL_SERVER_USER
        value: resend
      - key: EMAIL_SERVER_HOST
        value: smtp.resend.com
      - key: EMAIL_SERVER_PORT
        value: 465
      - key: AIRTABLE_GRANTS_API_TOKEN
        sync: false
      - key: AIRTABLE_GRANTS_BASE_ID
        sync: false
      - key: AIRTABLE_GRANTS_TABLE_NAME
        sync: false
      - key: AIRTABLE_GRANTS_REGIONS_TABLE_NAME
        sync: false
      - key: AIRTABLE_RECIPIENTS_TABLE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EARNCOGNITO_URL
        sync: false
      - key: EARNCOGNITO_SECRET
        sync: false
      - key: GOOGLE_ID
        sync: false
      - key: GOOGLE_SECRET
        sync: false
      - key: EMAIL_SECRET
        fromService:
          name: nearn-email
          type: pserv
          envVarKey: AUTH_SECRET
      - key: EMAIL_BACKEND
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: REPLY_TO_EMAIL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: UNSUB_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CEO_EMAIL
        sync: false
    autoDeploy: true
  - type: pserv
    repo: https://github.com/akorchyn/nearn-emails
    branch: prod
    name: nearn-email
    runtime: node
    region: frankfurt
    plan: starter
    previews:
      generation: off
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: REDIS_URL
        fromService:
          name: nearn-redis-for-emails
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: LISTINGS_EMAIL
        value: noreply@nearn.io
      - key: ALERTS_EMAIL
        value: noreply@nearn.io
      - key: MAIN_APP_URL
        value: 'https://nearn.io'
      - key: AIRTABLE_FORM_URL
        value: 'https://nearn.io'
      - key: DEV_EMAILS
        sync: false
      - key: BCC_EMAILS
        sync: false
      - key: BASE_URL
        value: 'https://nearn.io'
      - key: RESEND_API_KEY
        fromService:
          name: nearn-app
          type: web
          envVarKey: RESEND_API_KEY
      - key: UNSUB_SECRET
        fromService:
          name: nearn-app
          type: web
          envVarKey: UNSUB_SECRET
      - key: DATABASE_URL
        fromService:
          name: nearn-app
          type: web
          envVarKey: DATABASE_URL
      - key: CEO_EMAIL
        fromService:
          name: nearn-app
          type: web
          envVarKey: CEO_EMAIL
    autoDeploy: true
  - type: keyvalue
    name: nearn-redis-for-emails
    maxmemoryPolicy: noeviction
    region: frankfurt
    ipAllowList: []
    plan: starter
  - type: web
    name: nearn-app-staging
    repo: https://github.com/NEAR-DevHub/nearn
    branch: staging
    runtime: node
    region: frankfurt
    plan: standard
    previews:
      generation: manual
      plan: starter
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    preDeployCommand: pnpm prisma migrate deploy
    startCommand: pnpm start
    envVars:
      - key: CRON_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NODE_VERSION
        value: 20.11.0
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: EMAIL_SERVER_USER
        value: resend
      - key: EMAIL_SERVER_HOST
        value: smtp.resend.com
      - key: EMAIL_SERVER_PORT
        value: 465
      - key: AIRTABLE_GRANTS_API_TOKEN
        sync: false
      - key: AIRTABLE_GRANTS_BASE_ID
        sync: false
      - key: AIRTABLE_GRANTS_TABLE_NAME
        sync: false
      - key: AIRTABLE_GRANTS_REGIONS_TABLE_NAME
        sync: false
      - key: AIRTABLE_RECIPIENTS_TABLE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EARNCOGNITO_URL
        sync: false
      - key: EARNCOGNITO_SECRET
        sync: false
      - key: GOOGLE_ID
        sync: false
      - key: GOOGLE_SECRET
        sync: false
      - key: EMAIL_SECRET
        fromService:
          name: nearn-email-staging
          type: pserv
          envVarKey: AUTH_SECRET
      - key: EMAIL_BACKEND
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: REPLY_TO_EMAIL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: UNSUB_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CEO_EMAIL
        sync: false
    autoDeploy: true
  - type: pserv
    repo: https://github.com/akorchyn/nearn-emails
    branch: staging
    name: nearn-email-staging
    runtime: node
    region: frankfurt
    plan: starter
    previews:
      generation: off
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: REDIS_URL
        fromService:
          name: nearn-redis-for-emails-staging
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: LISTINGS_EMAIL
        value: staging@nearn.io
      - key: ALERTS_EMAIL
        value: staging@nearn.io
      - key: MAIN_APP_URL
        value: 'https://nearn-app-staging.onrender.com'
      - key: AIRTABLE_FORM_URL
        value: 'https://nearn-app-staging.onrender.com'
      - key: DEV_EMAILS
        sync: false
      - key: BCC_EMAILS
        sync: false
      - key: BASE_URL
        value: 'https://nearn-app-staging.onrender.com'
      - key: RESEND_API_KEY
        fromService:
          name: nearn-app-staging
          type: web
          envVarKey: RESEND_API_KEY
      - key: UNSUB_SECRET
        fromService:
          name: nearn-app-staging
          type: web
          envVarKey: UNSUB_SECRET
      - key: DATABASE_URL
        fromService:
          name: nearn-app-staging
          type: web
          envVarKey: DATABASE_URL
      - key: CEO_EMAIL
        fromService:
          name: nearn-app-staging
          type: web
          envVarKey: CEO_EMAIL
    autoDeploy: true
  - type: keyvalue
    name: nearn-redis-for-emails-staging
    maxmemoryPolicy: noeviction
    region: frankfurt
    ipAllowList: []
    plan: starter
  - type: cron
    name: check-listing-status-staging
    runtime: node
    region: frankfurt
    schedule: '*/5 * * * *' # Every 5 minutes for staging
    buildCommand: 'true'
    repo: https://github.com/NEAR-DevHub/nearn
    branch: staging
    startCommand: |
      CRON_SECRET=$CRON_SECRET ./scripts/cron-wrapper.sh https://nearn-app-staging.onrender.com/api/cron/check-listing-status
    envVars:
      - key: CRON_SECRET
        fromService:
          name: nearn-app-staging
          type: web
          envVarKey: CRON_SECRET
  - type: cron
    name: sync-treasury-status-staging
    runtime: node
    schedule: '*/5 * * * *' # Every 5 minutes for staging
    buildCommand: 'true'
    region: frankfurt
    repo: https://github.com/NEAR-DevHub/nearn
    branch: staging
    startCommand: |
      CRON_SECRET=$CRON_SECRET ./scripts/cron-wrapper.sh https://nearn-app-staging.onrender.com/api/cron/sync-treasury-payments
    envVars:
      - key: CRON_SECRET
        fromService:
          name: nearn-app-staging
          type: web
          envVarKey: CRON_SECRET
  - type: cron
    name: check-listing-status
    runtime: node
    region: frankfurt
    schedule: '*/5 * * * *' # Every 5 minutes for staging
    buildCommand: 'true'
    repo: https://github.com/NEAR-DevHub/nearn
    branch: prod
    startCommand: |
      CRON_SECRET=$CRON_SECRET ./scripts/cron-wrapper.sh https://nearn.io/api/cron/check-listing-status
    envVars:
      - key: CRON_SECRET
        fromService:
          name: nearn-app
          type: web
          envVarKey: CRON_SECRET
  - type: cron
    name: sync-treasury-status
    runtime: node
    schedule: '*/5 * * * *' # Every 5 minutes for staging
    buildCommand: 'true'
    region: frankfurt
    repo: https://github.com/NEAR-DevHub/nearn
    branch: prod
    startCommand: |
      CRON_SECRET=$CRON_SECRET ./scripts/cron-wrapper.sh https://nearn.io/api/cron/sync-treasury-payments
    envVars:
      - key: CRON_SECRET
        fromService:
          name: nearn-app
          type: web
          envVarKey: CRON_SECRET
  - type: web
    region: frankfurt
    plan: standard
    runtime: image
    name: n8n-service
    image:
      url: docker.io/n8nio/n8n:latest
    disk: # Persistent disk configuration
      name: n8n-disk
      mountPath: /home/node
      sizeGB: 1 # optional
    envVars:
      # Generates a base64-encoded key for
      # encrypting credentials in n8n
      #
      # Do not modify this value after it's generated!
      # If you do, you'll lose access to all credentials
      # encrypted with the previous value.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_RUNNERS_ENABLED
        value: true
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: true
      - key: STAGING_CRON_SECRET
        fromService:
          name: nearn-app-staging
          type: web
          envVarKey: CRON_SECRET
